# alembic.ini
# ------------
# Alembic configuration file.
# The `sqlalchemy.url` key is intentionally left blank here —
# it is read from the environment variable DATABASE_URL in alembic/env.py
# so that credentials are never hard-coded in version control.

[alembic]
script_location = alembic
prepend_sys_path = .

# Naming convention for auto-generated migration files.
# The %(rev)s prefix makes migrations sort chronologically.
file_template = %%(rev)s_%%(slug)s

# Truncate long slugs to keep filenames manageable.
truncate_slug_length = 40

# Timezone for the `down_revision` display in migration files.
timezone = UTC

# Max length of characters to print for a string in DDL statements
output_encoding = utf-8

[post_write_hooks]
# Optional: uncomment to auto-format generated migration files with black.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
